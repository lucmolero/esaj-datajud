name: Relatar Bug
description: Informe um comportamento inesperado com contexto técnico e jurídico suficiente.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o `esaj-datajud`.
        Não inclua dados pessoais, peças, HTML bruto ou informações sigilosas sem sanitização.
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Liste comandos, versão e entrada sanitizada.
      placeholder: |
        1. python -m pip install -e ".[dev]"
        2. esaj search 0000000-00.0000.0.00.0000
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão
      placeholder: "0.3.1"
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Inclua logs sanitizados, sistema operacional e versão do Python.
