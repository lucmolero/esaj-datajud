name: Solicitar Melhoria
description: Sugira uma melhoria de API, CLI, documentação ou parser.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema ou oportunidade
      description: Qual dor jurídica, acadêmica ou técnica esta melhoria resolve?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Descreva a solução desejada.
    validations:
      required: true
  - type: textarea
    id: limites
    attributes:
      label: Limites e cuidados
      description: Há risco de LGPD, sigilo, volume de consultas ou compatibilidade?
