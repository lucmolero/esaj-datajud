<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">eSAJ DataJud — logo reversa</title>
  <desc id="desc">Logo horizontal branca e verde para fundos escuros.</desc>
<rect width="1280" height="360" rx="36" fill="#0B1F33"/>
<g transform="translate(26 16) scale(0.64)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Institutional roof / legal portal -->
  <path d="M92 192 L256 102 L420 192" stroke="#FFFFFF" stroke-width="30"/>
  <path d="M126 214 H386" stroke="#FFFFFF" stroke-width="24"/>

  <!-- Two stable pillars. The center pillar is intentionally replaced by data. -->
  <path d="M156 244 V372" stroke="#FFFFFF" stroke-width="42"/>
  <path d="M356 244 V372" stroke="#FFFFFF" stroke-width="42"/>

  <!-- Structured judicial timeline -->
  <path d="M256 232 V380" stroke="#18A999" stroke-width="18"/>
  <circle cx="256" cy="246" r="20" fill="#18A999" stroke="none"/>
  <circle cx="256" cy="306" r="20" fill="#18A999" stroke="none"/>
  <circle cx="256" cy="366" r="20" fill="#18A999" stroke="none"/>

  <!-- Ground / rule of law -->
  <path d="M110 410 H402" stroke="#FFFFFF" stroke-width="30"/>
</g>
  <g font-family="Inter, IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <text x="380" y="168" font-size="86" font-weight="750" letter-spacing="-2" fill="#FFFFFF">eSAJ</text>
    <text x="660" y="168" font-size="86" font-weight="750" letter-spacing="-2" fill="#18A999">DataJud</text>
    <text x="384" y="224" font-size="23" font-weight="650" letter-spacing="4.4" fill="#C7D2DC">DADOS JUDICIAIS ESTRUTURADOS</text>
  </g>
</svg>
