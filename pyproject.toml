[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esaj-datajud"
version = "0.1.0"
description = "Biblioteca Python para extração e consulta de processos eSAJ/TJSP e DJEN/DataJud."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11"
]
license = {text = "MIT"}
authors = [
  {name = "Luciano Finozzi"},
  {name = "Luciano Molero", url = "https://www.linkedin.com/in/luciano-molero/"}
]
keywords = ["esaj", "tjsp", "datajud", "djens", "juridico", "processo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools]
packages = {find = {where = ["src"], include = ["esaj_datajud"]}}

[project.urls]
Source = "https://github.com/lucmolero/esaj-datajud"
LinkedIn = "https://www.linkedin.com/in/luciano-molero/"

[project.scripts]
esaj = "esaj_datajud.cli:main"
